<div class="page-wrapper" style="grid-template-columns: 1fr;">
  <main class="main-content">

    <div class="page-header">
      <div class="breadcrumb"><a href="index.html">首页</a><span>/</span>留言板</div>
      <h1>留言板</h1>
      <p style="color:var(--text-muted);font-size:13px;margin-top:4px;">请在该板块留下你对社团的建议与疑问，我们会一一解决~</p>
    </div>

    <!-- New Thread Form -->
    <div class="comment-section" style="margin-bottom:16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <h3 style="font-size:16px;font-weight:600;">社员论坛</h3>
        <button class="btn btn-primary" id="btnNewThread" style="font-size:13px;">+ 发帖</button>
      </div>
      <form class="comment-form" id="threadForm" style="display:none;">
        <input type="text" id="threadTitle" placeholder="帖子标题" maxlength="60" style="width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;">
        <textarea id="threadText" placeholder="帖子内容..." required style="min-height:100px;"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;justify-content:flex-end;">
          <button type="button" class="btn btn-outline" id="btnCancelThread" style="font-size:13px;">取消</button>
          <button type="submit" class="btn btn-primary" style="font-size:13px;">发布帖子</button>
        </div>
      </form>
    </div>

    <!-- Thread List -->
    <div id="threadList">
      <p style="text-align:center;padding:24px;color:var(--text-muted);">加载中...</p>
    </div>

    <!-- Thread Detail Modal -->
    <div class="modal-overlay" id="threadModal">
      <div class="modal" style="max-width:680px;max-height:90vh;">
        <button class="modal-close">&times;</button>
        <div id="threadDetail"></div>
        <div style="border-top:1px solid var(--border);padding-top:16px;margin-top:16px;">
          <h4 style="font-size:14px;font-weight:600;margin-bottom:10px;">回复</h4>
          <form id="replyForm" style="display:flex;flex-direction:column;gap:8px;">
            <textarea id="replyText" placeholder="写下你的回复..." required style="min-height:80px;width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;resize:vertical;outline:none;font-family:var(--font-sans);"></textarea>
            <button type="submit" class="btn btn-primary" style="align-self:flex-end;font-size:13px;">回复</button>
          </form>
        </div>
      </div>
    </div>

  </main>
</div>

    <div class="footer-stats">
      <span>今日 PV：<strong id="todayPV">--</strong></span>
      <span>今日 UV：<strong id="todayUV">--</strong></span>
      <span>总访问量：<strong id="totalVisits">--</strong></span>
    </div>

</button>

<script src="js/main.js"></script>
<script>
function esc(str) {
  var d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

var avatarColors = ['#fce4ec,#e8eaf6', '#e8f5e9,#fff3e0', '#e3f2fd,#f3e5f5', '#fff3e0,#fce4ec', '#f3e5f5,#e8eaf6', '#e0f7fa,#fff9c4'];
var allMessagesCache = [];

function loadThreads() {
  return API.get('/api/guestbook').then(function(data) {
    if (!Array.isArray(data)) { console.error('guestbook data not array:', data); return; }
    allMessagesCache = data;
    var threads = data.filter(function(m) { return !m.parent_id; });
    var list = document.getElementById('threadList');
    if (!list) return;
    if (threads.length === 0) {
      list.innerHTML = '<div class="comment-section" style="text-align:center;padding:32px;color:var(--text-muted);">暂无帖子，来说点什么吧~</div>';
      return;
    }
    list.innerHTML = threads.map(function(t) {
      var replyCount = data.filter(function(m) { return m.parent_id === t.id; }).length;
      var avatarStyle = 'background:linear-gradient(135deg,' + avatarColors[(t.author_id || 0) % avatarColors.length] + ');';
      return '<div class="thread-card" style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px 20px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;" data-id="' + t.id + '">' +
        '<div style="display:flex;align-items:flex-start;gap:14px;">' +
        '<div class="avatar" style="' + avatarStyle + ';flex-shrink:0;">' + esc((t.author_name || '?').charAt(0)) + '</div>' +
        '<div style="flex:1;min-width:0;">' +
        '<h4 style="font-size:15px;font-weight:600;margin-bottom:4px;">' + esc(t.title || '无标题') + '</h4>' +
        '<p style="font-size:13px;color:var(--text-light);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:8px;">' + esc(t.text || '') + '</p>' +
        '<div style="display:flex;gap:16px;font-size:12px;color:var(--text-muted);">' +
        '<span>' + esc(t.author_name || '匿名') + '</span>' + (typeof titleBadge==='function' ? titleBadge(t.author_title) : '') + '<span>' + t.created_at + '</span>' +
        '<span style="color:var(--accent);font-weight:500;">' + replyCount + ' 回复</span>' +
        '</div></div></div></div>';
    }).join('');

    list.querySelectorAll('.thread-card').forEach(function(card) {
      card.addEventListener('mouseenter', function() { this.style.boxShadow = '0 2px 12px rgba(0,0,0,0.06)'; });
      card.addEventListener('mouseleave', function() { this.style.boxShadow = 'none'; });
      card.addEventListener('click', function() { openThread(parseInt(this.dataset.id)); });
    });
  });
}

// Open thread detail in modal
function openThread(threadId) {
  console.log('openThread called with:', threadId);
  var t = allMessagesCache.find(function(m) { return m.id === threadId; });
  if (!t) { console.error('thread not found in cache'); return; }
  // Collect all descendant replies recursively
  var parentIds = [threadId];
  var allReplies = [];
  var found = true;
  while (found) {
    found = false;
    allMessagesCache.forEach(function(m) {
      if (m.parent_id && parentIds.indexOf(m.parent_id) >= 0 && allReplies.indexOf(m) < 0) {
        allReplies.push(m);
        if (parentIds.indexOf(m.id) < 0) parentIds.push(m.id);
        found = true;
      }
    });
  }
  allReplies.sort(function(a, b) { return new Date(a.created_at) - new Date(b.created_at); });
  var replies = allReplies;
  var detail = document.getElementById('threadDetail');
  if (!detail) { console.error('threadDetail not found'); return; }
  detail.innerHTML = '<h2 style="font-size:18px;margin-bottom:4px;">' + esc(t.title || '无标题') + '</h2>' +
    '<div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">' + esc(t.author_name || '匿名') + (typeof titleBadge==='function' ? titleBadge(t.author_title) : '') + ' · ' + t.created_at + '</div>' +
    '<div style="font-size:14px;line-height:1.8;color:var(--text-light);white-space:pre-wrap;word-break:break-word;">' + esc(t.text) + '</div>' +
    (allReplies.length > 0 ? '<div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);"><h4 style="font-size:14px;font-weight:600;margin-bottom:10px;">评论（' + allReplies.length + '）</h4>' +
      replies.map(function(r) {
        var av = 'background:linear-gradient(135deg,' + avatarColors[(r.author_id || 0) % avatarColors.length] + ');';
        var isNested = r.parent_id !== threadId;
        var parentReply = isNested ? allMessagesCache.find(function(m) { return m.id === r.parent_id; }) : null;
        var replyToHTML = parentReply ? '<div style="font-size:11px;color:var(--accent);margin-bottom:2px;">↳ 回复 @' + esc(parentReply.author_name || '匿名') + '</div>' : '';
        var indent = isNested ? 'margin-left:44px;' : '';
        return '<div class="reply-item" style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #f5f5f5;' + indent + '" data-reply-id="' + r.id + '" data-author="' + esc(r.author_name || '匿名') + '">' +
          '<div class="avatar" style="' + av + ';width:32px;height:32px;font-size:14px;flex-shrink:0;">' + esc((r.author_name || '?').charAt(0)) + '</div>' +
          '<div style="flex:1;"><div style="font-size:13px;font-weight:600;">' + esc(r.author_name || '匿名') + (typeof titleBadge==='function' ? titleBadge(r.author_title) : '') +
          '<span style="font-weight:400;color:var(--text-muted);margin-left:8px;font-size:11px;">' + r.created_at + '</span></div>' +
          replyToHTML +
          '<div style="font-size:13px;color:var(--text-light);margin-top:2px;">' + esc(r.text) + '</div>' +
          '<button class="reply-btn" data-reply-id="' + r.id + '" data-author="' + esc(r.author_name || '匿名') + '" style="margin-top:4px;">回复</button>' +
          '</div></div>';
      }).join('') + '</div>' : '');

    // Reply button handlers
    detail.querySelectorAll('.reply-btn').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        if (!API.token) { openAuthModal('login'); return; }
        window._replyTarget = { id: parseInt(this.dataset.replyId), author: this.dataset.author };
        var indicator = document.createElement('div');
        indicator.className = 'reply-to';
        indicator.id = 'replyIndicator';
        indicator.innerHTML = '回复 @' + esc(this.dataset.author) + ' <span class="cancel-reply" id="cancelReply">✕</span>';
        var existing = document.getElementById('replyIndicator');
        if (existing) existing.remove();
        var ta = document.getElementById('replyText');
        ta.parentNode.insertBefore(indicator, ta);
        ta.focus();
        document.getElementById('cancelReply').addEventListener('click', function() {
          window._replyTarget = null;
          indicator.remove();
        });
      });
    });

  var modal = document.getElementById('threadModal');
  if (!modal) { console.error('threadModal not found'); return; }
  modal.dataset.threadId = threadId;
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Thread modal close
var threadModal = document.getElementById('threadModal');
if (threadModal) {
  threadModal.querySelector('.modal-close').addEventListener('click', function() { threadModal.classList.remove('open'); document.body.style.overflow = ''; });
  threadModal.addEventListener('click', function(e) { if (e.target === threadModal) { threadModal.classList.remove('open'); document.body.style.overflow = ''; } });
}

// New thread form
document.getElementById('btnNewThread').addEventListener('click', function() {
  if (!API.token) { openAuthModal('login'); return; }
  document.getElementById('threadForm').style.display = 'block';
  this.style.display = 'none';
});
document.getElementById('btnCancelThread').addEventListener('click', function() {
  document.getElementById('threadForm').style.display = 'none';
  document.getElementById('btnNewThread').style.display = '';
  document.getElementById('threadTitle').value = '';
  document.getElementById('threadText').value = '';
});

// Post new thread
document.getElementById('threadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var title = document.getElementById('threadTitle').value.trim();
  var text = document.getElementById('threadText').value.trim();
  if (!title) { alert('请输入标题'); return; }
  if (!text) { alert('请输入内容'); return; }
  var btn = this.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '发布中...';
  API.post('/api/guestbook', { title: title, text: text }).then(function(d) {
    if (d.error) { alert(d.error); btn.disabled = false; btn.textContent = '发布帖子'; return; }
    document.getElementById('threadTitle').value = '';
    document.getElementById('threadText').value = '';
    document.getElementById('threadForm').style.display = 'none';
    document.getElementById('btnNewThread').style.display = '';
    btn.disabled = false; btn.textContent = '发布帖子';
    loadThreads();
  });
});

// Reply form submit
document.getElementById('replyForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (!API.token) { openAuthModal('login'); return; }
  var text = document.getElementById('replyText').value.trim();
  if (!text) return;
  var parentId = (window._replyTarget && window._replyTarget.id) ? window._replyTarget.id : parseInt(threadModal.dataset.threadId);
  window._replyTarget = null;
  var btn = this.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = '回复中...';
  API.post('/api/guestbook', { text: text, parentId: parentId }).then(function(d) {
    if (d.error) { alert(d.error); btn.disabled = false; btn.textContent = '回复'; return; }
    document.getElementById('replyText').value = '';
    var indicator = document.getElementById('replyIndicator');
    if (indicator) indicator.remove();
    btn.disabled = false; btn.textContent = '回复';
    setTimeout(function() {
      loadThreads().then(function() { openThread(parseInt(threadModal.dataset.threadId)); });
    }, 300);
  }).catch(function(e) {
    console.error('reply error:', e);
    btn.disabled = false; btn.textContent = '回复';
  });
});

// Open thread from notification
var urlParams = new URLSearchParams(window.location.search);
var openThreadId = urlParams.get('thread');
if (openThreadId) { setTimeout(function() { openThread(parseInt(openThreadId)); }, 500); }

window.openThread = openThread;
loadThreads();
</script>
