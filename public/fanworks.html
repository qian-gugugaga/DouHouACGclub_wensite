<div class="page-wrapper full-width">
  <main class="main-content">

    <div class="page-header">
      <div class="breadcrumb"><a href="index.html">首页</a><span>/</span>创作广场</div>
      <h1>创作广场</h1>
    </div>

    <div class="filter-tabs" style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="原创">原创</button>
      <button class="filter-tab" data-filter="同人">同人</button>
      <button class="filter-tab" data-filter="画">画</button>
      <button class="filter-tab" data-filter="COS">COS</button>
      <button class="filter-tab" data-filter="文章">文章</button>
      <button class="filter-tab" data-filter="其他">其他</button>
      <button class="filter-tab" data-filter="mine" id="tabMine" style="color:#e65100;font-weight:500;">我的</button>
    </div>

    <div class="masonry" id="fanworksMasonry">
      <!-- Dynamic content loaded by JS -->

  </main>
</div>

<!-- Submission Modal -->
<div class="modal-overlay" id="submitModal">
  <div class="modal">
    <button class="modal-close">&times;</button>
    <h2>我要投稿</h2>
    <div class="tag-row">
      <div class="tag-group" id="tagGroup1">
        <label>创作性质</label>
        <div class="tag-options">
          <span class="tag-option">原创</span>
          <span class="tag-option">同人</span>
        </div>
      </div>
      <div class="tag-group" id="tagGroup2">
        <label>作品类型</label>
        <div class="tag-options">
          <span class="tag-option">文章</span>
          <span class="tag-option">画</span>
          <span class="tag-option">COS</span>
          <span class="tag-option">其他</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">CN（创作者名）</label>
      <input type="text" id="submissionCN" placeholder="你的圈名/笔名" maxlength="30">
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">上传图片（第一张为封面）</label>
      <div class="img-upload-area" id="imgUploadTrigger">
        <div style="font-size:28px;">🖼️</div>
        <p>点击上传图片，支持多张</p>
        <input type="file" id="submissionImages" accept="image/*" multiple style="display:none;">
      </div>
      <div class="img-previews" id="submissionImgPreviews"></div>
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">正文内容</label>
      <textarea id="submissionText" placeholder="写下你想说的话..." style="min-height:120px;"></textarea>
    </div>
    <button class="submit-btn" id="submitFormBtn">提交投稿</button>
  </div>
</div>

<!-- Content Detail Modal (小黑盒风格) -->
<div class="content-modal-overlay" id="contentModal">
  <div class="content-modal">
    <button class="cm-close">&times;</button>
    <div class="cm-carousel">
      <div class="carousel-track"></div>
      <button class="carousel-btn prev">&lsaquo;</button>
      <button class="carousel-btn next">&rsaquo;</button>
      <div class="carousel-dots"></div>
    </div>
    <div class="cm-body">
      <div class="cm-tags"></div>
      <div class="cm-author"></div>
      <div class="cm-text"></div>
      <div class="cm-actions">
        <button class="cm-like-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          <span class="count">0</span>
        </button>
      </div>
      <!-- Comments -->
      <div class="cm-comments" id="fanworkComments" style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px;">
        <h4 style="font-size:14px;font-weight:600;margin-bottom:10px;">评论</h4>
        <div id="fanworkCommentList"></div>
        <div style="margin-top:10px;">
          <textarea id="fanworkCommentInput" placeholder="写下你的评论..." style="width:100%;min-height:60px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;resize:vertical;outline:none;font-family:var(--font-sans);"></textarea>
          <button id="fanworkCommentBtn" class="btn btn-primary" style="font-size:12px;margin-top:6px;">发表评论</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating Submit Button -->
<button class="float-submit-btn" id="openSubmitModal">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  我要投稿
</button>

</button>

<script src="js/main.js"></script>
<script>
(function() {
  var masonry = document.getElementById('fanworksMasonry');
  var allWorksCache = [];
  var myWorksCache = [];
  var currentFilter = 'all';
  var statusLabel = { pending: '审核中', approved: '已通过', rejected: '已拒绝' };
  var statusColor = { pending: '#fb8c00', approved: '#43a047', rejected: '#c62828' };

  function getAllWorks() {
    return API.get('/api/fanworks').then(function(data) {
      if (Array.isArray(data)) return data;
      return [];
    }).catch(function() { return []; });
  }

  function getMyWorks() {
    if (!API.token) return Promise.resolve([]);
    return API.get('/api/fanworks/mine').then(function(data) {
      if (Array.isArray(data)) return data;
      return [];
    }).catch(function() { return []; });
  }

  var colorBgMap = { '画': '#fce4ec,#f8bbd0', 'COS': '#e8eaf6,#c5cae9', '文章': '#fff3e0,#ffe0b2', '其他': '#f3e5f5,#e1bee7' };
  var emojiMap = { '画': '🎨', 'COS': '📸', '文章': '📝', '其他': '📦' };

  function makeCard(w, showStatus) {
    var coverSrc = w.images && w.images.length > 0 ? w.images[0] : '';
    var minH = w.tag2 === '文章' ? 200 : (w.tag2 === 'COS' ? 320 : 240);
    var innerHTML = coverSrc
      ? '<img src="' + coverSrc + '" alt="" style="width:100%;height:100%;object-fit:cover;">'
      : '<div style="background:linear-gradient(135deg,' + (colorBgMap[w.tag2] || '#e0e0e0,#d0d0d0') + ');min-height:' + minH + 'px;display:flex;align-items:center;justify-content:center;font-size:48px;">' + (emojiMap[w.tag2] || '✨') + '</div>';
    var statusTag = showStatus ? '<span style="position:absolute;top:6px;right:6px;padding:2px 8px;border-radius:4px;font-size:10px;color:#fff;background:' + (statusColor[w.status] || '#757575') + ';z-index:2;">' + (statusLabel[w.status] || w.status) + '</span>' : '';
    return '<div class="masonry-item" data-work="' + w.id + '" style="cursor:pointer;">' +
      '<div class="masonry-img" style="position:relative;">' + statusTag + innerHTML + '</div>' +
      '<div class="masonry-info">' +
      '<h4>' + esc((w.text || '').substring(0, 40)) + '...</h4>' +
      '<div class="author">' + esc(w.author_name || '') + (typeof titleBadge==='function' ? titleBadge(w.author_title) : '') + ' · ' + esc(w.tag1) + ' · ' + esc(w.tag2) + '</div>' +
      '<div class="actions"><button class="like-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> <span class="count">' + (w.likes || 0) + '</span></button></div>' +
      '</div></div>';
  }

  function renderWorks(filter) {
    currentFilter = filter;
    var works, showStatus = false;
    if (filter === 'mine') {
      works = myWorksCache;
      showStatus = true;
    } else {
      works = allWorksCache;
      if (filter && filter !== 'all') {
        works = works.filter(function(w) { return w.tag1 === filter || w.tag2 === filter; });
      }
    }
    if (works.length === 0) {
      masonry.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">' + (filter === 'mine' ? '你还没有投稿，点击右下角「我要投稿」开始吧~' : '暂无作品~') + '</p>';
      return;
    }
    var sourceCache = filter === 'mine' ? myWorksCache : allWorksCache;
    masonry.innerHTML = works.map(function(w) { return makeCard(w, showStatus); }).join('');
    masonry.querySelectorAll('.masonry-item').forEach(function(item) {
      item.addEventListener('click', function(e) {
        if (e.target.closest('.like-btn')) return;
        var workId = parseInt(this.dataset.work);
        var work = sourceCache.find(function(w) { return w.id === workId; });
        if (work && window.openContentModal) window.openContentModal(work);
      });
    });
  }

  document.querySelectorAll('.filter-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      var f = this.dataset.filter;
      if (f === 'mine' && !API.token) { openAuthModal('login'); return; }
      if (f === 'mine' && myWorksCache.length === 0) {
        getMyWorks().then(function(d) { myWorksCache = d; renderWorks('mine'); });
      } else {
        renderWorks(f);
      }
    });
  });

  function esc(str) {
    var d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  // Initial load
  getAllWorks().then(function(works) {
    allWorksCache = works;
    renderWorks('all');
    // Open specific work from URL param (notification link)
    var urlParams = new URLSearchParams(window.location.search);
    var workId = urlParams.get('id');
    if (workId) {
      setTimeout(function() {
        var work = allWorksCache.find(function(w) { return w.id === parseInt(workId); });
        if (work && window.openContentModal) window.openContentModal(work);
      }, 500);
    }
  });
})();
</script>
</body>
