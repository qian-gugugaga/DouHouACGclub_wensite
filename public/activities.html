<script src="js/main.js"></script>
<script>
var allActivities = [];
var statusLabel = { upcoming: '即将开始', ongoing: '进行中', past: '已结束' };
var statusClass = { upcoming: 'tag-upcoming', ongoing: 'tag-ongoing', past: 'tag-past' };
var statusColor = { upcoming: '#43a047', ongoing: '#fb8c00', past: '#757575' };

function loadActivities() {
  API.get('/api/activities').then(function(data) {
    allActivities = data || [];
    renderActivities('all');
  }).catch(function() {
    document.getElementById('activityTimeline').innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">加载失败~</p>';
  });
}

function renderActivities(filter) {
  var timeline = document.getElementById('activityTimeline');
  var filtered = allActivities;
  if (filter && filter !== 'all') {
    filtered = allActivities.filter(function(a) { return a.status === filter; });
  }
  if (filtered.length === 0) {
    timeline.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">暂无活动~</p>';
    return;
  }
  timeline.innerHTML = filtered.map(function(a) {
    return '<div class="timeline-item" data-category="' + a.status + '" data-id="' + a.id + '" style="cursor:pointer;">' +
      '<div class="event-date">' + a.event_date + '</div>' +
      '<h3>' + escapeHTML(a.title) + '</h3>' +
      (a.cn ? '<p style="font-size:12px;color:var(--accent);font-weight:500;margin:2px 0;">CN：「' + escapeHTML(a.cn) + '」</p>' : '') +
      '<p>' + escapeHTML((a.description || '').substring(0, 150)) + '</p>' +
      '<span class="event-tag ' + (statusClass[a.status] || 'tag-past') + '">' + (statusLabel[a.status] || a.status) + '</span>' +
      '</div>';
  }).join('');

  timeline.querySelectorAll('.timeline-item').forEach(function(item) {
    item.addEventListener('click', function() {
      var id = parseInt(this.dataset.id);
      var activity = allActivities.find(function(a) { return a.id === id; });
      if (activity) openActivityDetail(activity);
    });
  });
}

function openActivityDetail(a) {
  document.getElementById('activityDetailTitle').textContent = a.title;
  document.getElementById('activityDetailDate').textContent = '📅 ' + a.event_date + (a.cn ? '  ·  CN：「' + a.cn + '」' : '');
  var statusEl = document.getElementById('activityDetailStatus');
  statusEl.textContent = statusLabel[a.status] || a.status;
  statusEl.style.background = statusColor[a.status] || '#757575';
  document.getElementById('activityDetailDesc').textContent = a.description || '';
  document.getElementById('activityModal').classList.add('open');
  document.body.style.overflow = 'hidden';
}

// Activity modal close
var activityModal = document.getElementById('activityModal');
if (activityModal) {
  activityModal.querySelector('.modal-close').addEventListener('click', function() {
    activityModal.classList.remove('open'); document.body.style.overflow = '';
  });
  activityModal.addEventListener('click', function(e) {
    if (e.target === activityModal) { activityModal.classList.remove('open'); document.body.style.overflow = ''; }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && activityModal.classList.contains('open')) {
      activityModal.classList.remove('open'); document.body.style.overflow = '';
    }
  });
}

// Filter tabs
document.querySelectorAll('.filter-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
    this.classList.add('active');
    renderActivities(this.dataset.filter);
  });
});

loadActivities();
</script>
