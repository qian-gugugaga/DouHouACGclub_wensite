<script src="js/main.js"></script>
<script>
var avatarColors = ['#fce4ec,#e8eaf6', '#e8f5e9,#fff3e0', '#e3f2fd,#f3e5f5', '#fff3e0,#fce4ec', '#f3e5f5,#e8eaf6', '#e0f7fa,#fff9c4'];

API.get('/api/auth/users').then(function(data) {
  var users = data.users || [];
  document.getElementById('totalMembers').textContent = users.length;
  document.getElementById('adminCount').textContent = users.filter(function(u) { return u.role === 'admin'; }).length;

  var grid = document.getElementById('memberGrid');
  if (!users.length) {
    grid.innerHTML = '<p style="text-align:center;padding:24px;color:var(--text-muted);">暂无成员~</p>';
    return;
  }
  grid.innerHTML = users.map(function(u) {
    var av = 'background:linear-gradient(135deg,' + avatarColors[(u.id || 0) % avatarColors.length] + ');';
    var avatarHTML = u.avatar
      ? '<img src="' + u.avatar + '" style="width:56px;height:56px;border-radius:50%;object-fit:cover;">'
      : '<div style="width:56px;height:56px;border-radius:50%;' + av + 'display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;font-weight:700;">' + (u.username || '?').charAt(0).toUpperCase() + '</div>';
    var badge = '';
    if (u.role === 'admin') badge = '<span class="user-badge" style="background:#fff9c4;color:#f57f17;">管理员</span>';
    else if (u.title) badge = '<span class="user-badge badge-custom">' + escapeHTML(u.title) + '</span>';
    else badge = '<span class="user-badge badge-member">东方社员</span>';
    return '<a href="profile.html?id=' + u.id + '" style="background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center;text-decoration:none;color:inherit;transition:all 0.2s;" onmouseenter="this.style.boxShadow=\'0 4px 16px rgba(0,0,0,0.08)\';this.style.transform=\'translateY(-2px)\'" onmouseleave="this.style.boxShadow=\'none\';this.style.transform=\'\'">' +
      '<div style="display:flex;justify-content:center;margin-bottom:8px;">' + avatarHTML + '</div>' +
      '<div style="font-weight:600;font-size:14px;margin-bottom:4px;">' + escapeHTML(u.username) + '</div>' +
      badge +
      '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">' + u.created_at.substring(0, 10) + ' 加入</div>' +
      '</a>';
  }).join('');
}).catch(function() {
  document.getElementById('memberGrid').innerHTML = '<p style="text-align:center;padding:24px;color:#c62828;">加载失败</p>';
});

function escapeHTML(str) {
  var d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}
</script>
