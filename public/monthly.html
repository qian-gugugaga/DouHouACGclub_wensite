<script src="js/main.js"></script>
<script>
(function() {
  // Render content: replace {{img:N}} with actual images, wrap paragraphs
  function renderContent(content, images) {
    if (!content) return '';
    // Escape HTML
    var html = content.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // Replace image placeholders
    if (images && images.length > 0) {
      html = html.replace(/\{\{img:(\d+)\}\}/g, function(match, idx) {
        var i = parseInt(idx);
        if (images[i]) {
          return '<img src="' + images[i] + '" alt="配图" style="max-width:100%;border-radius:8px;margin:12px 0;display:block;">';
        }
        return match;
      });
    }
    // Split by double newlines and wrap in <p>
    var parts = html.split(/\n\n+/);
    return parts.map(function(p) {
      p = p.trim();
      if (!p) return '';
      if (p.match(/^<img\s/)) return p;
      return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
    }).join('\n');
  }

  var list = document.getElementById('monthlyList');
  var allIssues = [];

  function loadIssues() {
    API.get('/api/monthly').then(function(data) {
      if (Array.isArray(data)) allIssues = data;
      if (allIssues.length === 0) {
        document.getElementById('featuredArticle').innerHTML = '';
        list.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">暂无已发布的月刊~</p>';
        return;
      }
      renderList();
    });
  }

  function openDetail(issue, dateStr) {
    var modal = document.getElementById('monthlyDetailModal');
    var content = document.getElementById('monthlyDetailContent');
    var html = renderContent(issue.content || '', issue.images || []);
    content.innerHTML = '<h2>' + escapeHTML(issue.title) + '</h2>' +
      (issue.cn ? '<p style="color:var(--accent);font-size:13px;font-weight:500;">CN：「' + escapeHTML(issue.cn) + '」</p>' : '') +
      '<p style="color:var(--text-muted);font-size:13px;">' + escapeHTML(dateStr) + '</p><hr style="margin:16px 0;border-color:var(--border);">' + html;
    modal.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function excerpt(text, maxLen) {
    var clean = (text || '').replace(/\{\{img:\d+\}\}/g, '[图]').replace(/\n\n/g, ' ').replace(/\n/g, ' ');
    return clean.length > maxLen ? clean.substring(0, maxLen) + '...' : clean;
  }

  function makeIssueCard(issue, i, featured) {
    var pd = issue.publish_date || issue.publishDate || '';
  var dateStr = pd ? pd.replace('-', '年') + '月' : '';
    var colors = ['#fce4ec,#f8bbd0', '#e3f2fd,#bbdefb', '#e8f5e9,#c8e6c9', '#fff3e0,#ffe0b2', '#f3e5f5,#e1bee7', '#e0f7fa,#b2ebf2'];
    var coverHTML = issue.cover
      ? '<div class="cover"><img src="' + issue.cover + '" alt="封面" style="width:100%;height:100%;object-fit:cover;"></div>'
      : '<div class="cover" style="background:linear-gradient(135deg,' + colors[i % colors.length] + ');display:flex;align-items:center;justify-content:center;font-size:' + (featured ? '40px' : '32px') + ';">📖</div>';
    var cardStyle = featured ? 'margin-bottom:20px;border-left:4px solid var(--accent);' : '';
    return '<div class="article-card" style="cursor:pointer;' + cardStyle + '" data-idx="' + i + '">' +
      coverHTML +
      '<div class="article-info">' +
      '<h3>' + escapeHTML(issue.title) + '</h3>' +
      (issue.cn ? '<p style="font-size:12px;color:var(--accent);font-weight:500;margin:2px 0;">CN：「' + escapeHTML(issue.cn) + '」</p>' : '') +
      '<p class="excerpt">' + escapeHTML(excerpt(issue.content, featured ? 120 : 80)) + '</p>' +
      '<div class="article-meta">' +
      (dateStr ? '<span>' + escapeHTML(dateStr) + '</span>' : '') +
      '<span>点击阅读</span>' +
      '</div></div></div>';
  }

  function renderList() {
    // Featured article (first issue)
    if (allIssues.length > 0) {
      document.getElementById('featuredArticle').innerHTML = makeIssueCard(allIssues[0], 0, true);
      document.getElementById('featuredArticle').querySelector('.article-card').addEventListener('click', function() {
        var issue = allIssues[0];
        openDetail(issue, (issue.publish_date || issue.publishDate || '') ? (issue.publish_date || issue.publishDate || '').replace('-', '年') + '月' : '');
      });
    }

    // List (remaining)
    list.innerHTML = allIssues.slice(1).map(function(issue, i) { return makeIssueCard(issue, i + 1, false); }).join('');

    // Click handlers
    list.querySelectorAll('.article-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var idx = parseInt(this.dataset.idx);
        var issue = allIssues[idx];
        openDetail(issue, (issue.publish_date || issue.publishDate || '') ? (issue.publish_date || issue.publishDate || '').replace('-', '年') + '月' : '');
      });
    });
  }

  function escapeHTML(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadIssues();

  // Monthly detail modal close
  const detailModal = document.getElementById('monthlyDetailModal');
  if (detailModal) {
    detailModal.querySelector('.modal-close').addEventListener('click', () => {
      detailModal.classList.remove('open');
      document.body.style.overflow = '';
    });
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) {
        detailModal.classList.remove('open');
        document.body.style.overflow = '';
      }
    });
  }
})();
</script>
