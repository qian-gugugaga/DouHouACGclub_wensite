<div class="page-wrapper full-width">
  <main class="main-content">

    <div class="page-header">
      <div class="breadcrumb"><a href="index.html">首页</a><span>/</span>动漫集市</div>
      <h1>动漫集市</h1>
    </div>

    <div class="filter-tabs" style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap;">
      <button class="filter-tab active" data-filter="all">全部</button>
      <button class="filter-tab" data-filter="吧唧">吧唧</button>
      <button class="filter-tab" data-filter="手办">手办</button>
      <button class="filter-tab" data-filter="色纸">色纸</button>
      <button class="filter-tab" data-filter="立牌">立牌</button>
      <button class="filter-tab" data-filter="娃娃">娃娃</button>
      <button class="filter-tab" data-filter="其他">其他</button>
      <button class="filter-tab" data-filter="mine" id="marketTabMine" style="color:#e65100;font-weight:500;">我的</button>
    </div>

    <div class="market-grid" id="marketGrid">
      <!-- Dynamic content loaded by JS -->
    </div>

    <p style="text-align:center;margin-top:16px;color:var(--text-muted);font-size:13px;">
      ⚠️ 交易请通过QQ联系对方，谨防诈骗。发布物品请点击右下角"我要发布"。
    </p>

  </main>
</div>

<!-- Market Submission Modal -->
<div class="modal-overlay" id="marketSubmitModal">
  <div class="modal">
    <button class="modal-close">&times;</button>
    <h2>发布物品</h2>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">物品名称</label>
      <input type="text" id="marketItemTitle" placeholder="例：初音未来 15周年纪念手办" maxlength="60">
    </div>
    <div class="form-row-inline">
      <div class="form-group">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">价格</label>
        <input type="text" id="marketPrice" placeholder="例：580（可小刀）" maxlength="30">
      </div>
      <div class="form-group">
        <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">QQ号</label>
        <input type="text" id="marketQQ" placeholder="方便买家联系你" maxlength="20">
      </div>
    </div>
    <div class="tag-row">
      <div class="tag-group" id="marketTagGroup">
        <label>物品类型</label>
        <div class="tag-options">
          <span class="tag-option">吧唧</span>
          <span class="tag-option">手办</span>
          <span class="tag-option">色纸</span>
          <span class="tag-option">立牌</span>
          <span class="tag-option">娃娃</span>
          <span class="tag-option">其他</span>
        </div>
      </div>
      <div class="tag-group">
        <label>IP（作品来源）</label>
        <input type="text" id="marketIP" placeholder="例：初音未来、鬼灭之刃..." maxlength="30" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;width:100%;outline:none;">
      </div>
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">物品图片（第一张为封面，支持jpg/png/gif）</label>
      <div class="img-upload-area" id="marketImgUploadTrigger">
        <div style="font-size:28px;">🖼️</div>
        <p>点击上传图片，支持多张</p>
        <input type="file" id="marketImages" accept="image/*" multiple style="display:none;">
      </div>
      <div class="img-previews" id="marketImgPreviews"></div>
    </div>
    <div class="form-group">
      <label style="font-size:13px;font-weight:600;display:block;margin-bottom:6px;">物品描述</label>
      <textarea id="marketText" placeholder="描述物品成色、新旧程度、交换方式等..." style="min-height:100px;"></textarea>
    </div>
    <button class="submit-btn" id="marketSubmitBtn">提交发布</button>
  </div>
</div>

<!-- Market Detail Modal -->
<div class="content-modal-overlay" id="marketDetailModal">
  <div class="content-modal">
    <button class="cm-close">&times;</button>
    <div class="cm-carousel">
      <div class="carousel-track"></div>
      <button class="carousel-btn prev">&lsaquo;</button>
      <button class="carousel-btn next">&rsaquo;</button>
      <div class="carousel-dots"></div>
    </div>
    <div class="cm-body">
      <div class="cm-tags"></div>
      <div class="cm-author"></div>
      <div style="font-size:14px;color:var(--accent);font-weight:600;margin-bottom:8px;" class="cm-price"></div>
      <div style="font-size:13px;color:var(--text-light);margin-bottom:8px;" class="cm-qq"></div>
      <div class="cm-text"></div>
      <!-- Comments -->
      <div class="cm-comments" id="marketComments" style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px;">
        <h4 style="font-size:14px;font-weight:600;margin-bottom:10px;">评论</h4>
        <div id="marketCommentList"></div>
        <div style="margin-top:10px;">
          <textarea id="marketCommentInput" placeholder="写下你的评论..." style="width:100%;min-height:60px;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;resize:vertical;outline:none;font-family:var(--font-sans);"></textarea>
          <button id="marketCommentBtn" class="btn btn-primary" style="font-size:12px;margin-top:6px;">发表评论</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Floating Publish Button -->
<button class="float-submit-btn" id="openMarketSubmitModal" style="right:80px;">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  我要发布
</button>

<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-stats">
      <span>今日 PV：<strong id="todayPV">--</strong></span>
      <span>今日 UV：<strong id="todayUV">--</strong></span>
      <span>总访问量：<strong id="totalVisits">--</strong></span>
    </div>
    <p>&copy; 2026 东方动漫社 · 神秘据点 | Powered by Love &amp; ACG</p>
  </div>
</footer>

<button class="back-to-top" id="backToTop" aria-label="回到顶部">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m18 15-6-6-6 6"/></svg>
</button>

<script src="js/main.js"></script>
<script>
(function() {
  var grid = document.getElementById('marketGrid');

  function getAllItems() {
    return API.get('/api/market').then(function(data) {
      if (Array.isArray(data)) return data;
      return [];
    }).catch(function() { return []; });
  }

  function getMyItems() {
    if (!API.token) return Promise.resolve([]);
    return API.get('/api/market/mine').then(function(data) {
      if (Array.isArray(data)) return data;
      return [];
    }).catch(function() { return []; });
  }

  var tagColors = {
    '吧唧': { bg: '#43a047', text: '#fff' },
    '手办': { bg: '#e75a7c', text: '#fff' },
    '色纸': { bg: '#1e88e5', text: '#fff' },
    '立牌': { bg: '#fb8c00', text: '#fff' },
    '娃娃': { bg: '#8e24aa', text: '#fff' },
    '其他': { bg: '#757575', text: '#fff' }
  };
  var colorBgMap = { '手办': '#fce4ec,#f8bbd0', '吧唧': '#e8f5e9,#c8e6c9', '色纸': '#e3f2fd,#bbdefb', '立牌': '#fff3e0,#ffe0b2', '娃娃': '#f3e5f5,#e1bee7', '其他': '#f5f5f5,#e0e0e0' };
  var emojiMap = { '手办': '🎀', '吧唧': '🔴', '色纸': '🖼️', '立牌': '💎', '娃娃': '🧸', '其他': '📦' };

  var currentFilter = 'all';
  var allItemsCache = [];
  var myItemsCache = [];
  var statusLabel = { pending: '审核中', approved: '已通过', rejected: '已拒绝' };
  var statusColor = { pending: '#fb8c00', approved: '#43a047', rejected: '#c62828' };

  function makeCard(w, showStatus) {
    var tc = tagColors[w.tag] || tagColors['其他'];
    var coverSrc = w.images && w.images.length > 0 ? w.images[0] : '';
    var thumbHTML = coverSrc
      ? '<img src="' + coverSrc + '" alt="">'
      : '<div style="width:100%;height:100%;background:linear-gradient(135deg,' + (colorBgMap[w.tag] || '#f5f5f5,#e0e0e0') + ');display:flex;align-items:center;justify-content:center;font-size:48px;">' + (emojiMap[w.tag] || '📦') + '</div>';
    thumbHTML += '<span class="thumb-tag" style="background:' + tc.bg + ';">' + escapeHTML(w.tag) + '</span>';
    if (w.ip) thumbHTML += '<span class="thumb-ip">' + escapeHTML(w.ip) + '</span>';
    if (showStatus) thumbHTML += '<span style="position:absolute;top:6px;left:6px;padding:2px 6px;border-radius:4px;font-size:10px;color:#fff;background:' + (statusColor[w.status] || '#757575') + ';">' + (statusLabel[w.status] || w.status) + '</span>';
    return '<div class="market-card" data-item="' + w.id + '" style="cursor:pointer;">' +
      '<div class="thumb" style="position:relative;">' + thumbHTML + '</div>' +
      '<div class="info">' +
      '<h3>' + escapeHTML(w.title) + '</h3>' +
      '<div class="price">' + escapeHTML(w.price) + '</div>' +
      '<div class="market-qq"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21.395 15.035a39.548 39.548 0 0 0-.803-2.264l-1.079-2.695c.001-.032.014-.562.014-.836C19.527 4.661 17.335 2.418 12 2.418s-7.527 2.243-7.527 6.822c0 .274.013.804.014.836l-1.08 2.695a38.97 38.97 0 0 0-.802 2.264c-1.021 3.283-1.045 4.17-.065 4.547 1.635.628 3.986-.504 5.277-1.064 1.806.45 3.871.563 6.183.563 2.312 0 4.377-.113 6.183-.563 1.291.56 3.642 1.692 5.277 1.064.98-.377.956-1.264-.065-4.547z"/></svg>' + escapeHTML(w.qq) + '</div>' +
      '</div></div>';
  }

  function renderItems(filter) {
    currentFilter = filter;
    var items, showStatus = false, sourceCache;
    if (filter === 'mine') {
      items = myItemsCache;
      sourceCache = myItemsCache;
      showStatus = true;
    } else {
      items = allItemsCache;
      sourceCache = allItemsCache;
      if (filter && filter !== 'all') {
        items = items.filter(function(w) { return w.tag === filter; });
      }
    }
    if (items.length === 0) {
      grid.innerHTML = '<p style="text-align:center;padding:40px;color:var(--text-muted);">' + (filter === 'mine' ? '你还没有发布物品，点击右下角「我要发布」开始吧~' : '暂无物品~') + '</p>';
      return;
    }
    grid.innerHTML = items.map(function(w) { return makeCard(w, showStatus); }).join('');
    grid.querySelectorAll('.market-card').forEach(function(card) {
      card.addEventListener('click', function() {
        var itemId = parseInt(this.dataset.item);
        var item = sourceCache.find(function(w) { return w.id === itemId; });
        if (item && window.openMarketDetail) window.openMarketDetail(item);
      });
    });
  }

  document.querySelectorAll('.filter-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.filter-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      var f = this.dataset.filter;
      if (f === 'mine' && !API.token) { openAuthModal('login'); return; }
      if (f === 'mine') {
        getMyItems().then(function(d) { myItemsCache = d; renderItems('mine'); });
      } else {
        renderItems(f);
      }
    });
  });

  function escapeHTML(str) {
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  // Load from API
  getAllItems().then(function(items) {
    allItemsCache = items;
    renderItems('all');
    // Open specific item from URL param (notification link)
    var urlParams = new URLSearchParams(window.location.search);
    var itemId = urlParams.get('id');
    if (itemId) {
      setTimeout(function() {
        var item = allItemsCache.find(function(w) { return w.id === parseInt(itemId); });
        if (item && window.openMarketDetail) window.openMarketDetail(item);
      }, 500);
    }
  });

  // Comment button handler
  var mcb = document.getElementById('marketCommentBtn');
  if (mcb) {
    mcb.addEventListener('click', function() {
      var modal = document.getElementById('marketDetailModal');
      if (!modal || !modal._targetId) return;
      if (typeof postComment === 'function') {
        postComment('market', modal._targetId, 'marketCommentInput', 'marketCommentList');
      }
    });
  }
  // Enter key to submit market comment
  var marketInput = document.getElementById('marketCommentInput');
  if (marketInput) {
    marketInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        var modal = document.getElementById('marketDetailModal');
        if (!modal || !modal._targetId) return;
        if (typeof postComment === 'function') {
          postComment('market', modal._targetId, 'marketCommentInput', 'marketCommentList');
        }
      }
    });
  }
})();
</script>
</body>
</html>
